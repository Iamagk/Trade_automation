<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quantum Trade | TPB Dashboard</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    <div class="container">
        <header>
            <div class="logo">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="22 7 13.5 15.5 8.5 10.5 2 17"></polyline><polyline points="16 7 22 7 22 13"></polyline></svg>
                QUANTUM TRADE
            </div>
            <div class="status-badge" id="engine-status">ENGINE: RUNNING</div>
        </header>

        <div class="dashboard-grid">
            <!-- Stats Row -->
            <div class="stats-row">
                <div class="card">
                    <div class="stat-label">MARKET TREND</div>
                    <div class="stat-value" id="trend-val">UNKNOWN</div>
                    <div class="stat-label" id="trend-sub">Observation Window</div>
                </div>
                <div class="card">
                    <div class="stat-label">LIVE P&L</div>
                    <div class="stat-value" id="pnl-val">₹ 0.00</div>
                    <div class="stat-label" id="pnl-pct">0.00%</div>
                </div>
                <div class="card">
                    <div class="stat-label">DAILY SUMMARY</div>
                    <div class="stat-value" id="daily-pnl">₹ 0.00</div>
                    <div class="stat-label" id="trade-count">0 Trades Today</div>
                </div>
            </div>

            <!-- Main Chart Card -->
            <div class="card">
                <div class="card-title">
                    REAL-TIME ANALYSIS
                    <span class="status-badge" id="setup-status">WAITING FOR SETUP</span>
                </div>
                <div id="chart-container">
                    <canvas id="mainChart"></canvas>
                </div>
            </div>

            <!-- Side Panel -->
            <div class="panel-right">
                <div class="card">
                    <div class="card-title">ACTIVE POSITION</div>
                    <div class="trade-details" id="position-details">
                        <div class="detail-row">
                            <span class="detail-label">Symbol</span>
                            <span class="detail-value" id="pos-symbol">-</span>
                        </div>
                        <div class="detail-row">
                            <span class="detail-label">Entry Price</span>
                            <span class="detail-value" id="pos-entry">0.00</span>
                        </div>
                        <div class="detail-row">
                            <span class="detail-label">Current Price</span>
                            <span class="detail-value" id="pos-ltp">0.00</span>
                        </div>
                        <div class="detail-row">
                            <span class="detail-label">Stop Loss / Target</span>
                            <span class="detail-value" id="pos-sl-tgt">0 / 0</span>
                        </div>
                        <div class="detail-row">
                            <span class="detail-label">Trailing SL</span>
                            <span class="detail-value" id="pos-tsl">0.00</span>
                        </div>
                    </div>
                </div>

                <div class="card">
                    <div class="card-title">OPERATIONS</div>
                    <div class="controls">
                        <button class="btn btn-ce" onclick="manualTrade('BUY_CE')">Manual CE</button>
                        <button class="btn btn-pe" onclick="manualTrade('BUY_PE')">Manual PE</button>
                        <button class="btn btn-exit" onclick="manualExit()">Force Square Off</button>
                        <button class="btn btn-kill" onclick="activateKillSwitch()">🚨 KILL SWITCH</button>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script src="dashboard.js"></script>
</body>
</html>
